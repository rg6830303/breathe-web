<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source SVG for the ADMIN console PWA icon. Deliberately INVERTED from the
  user/website icon (which is blue bg + white paddle) so the two installed apps
  are instantly distinguishable on the home screen: dark ink background, a lime
  paddle, a blue pickleball dot, plus a small "owner shield" badge.

  Re-render PNGs with `node scripts/generate-admin-icons.mjs` after editing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" ry="96" fill="#0D1426"/>
  <!-- thin lime frame -->
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#C6F432" stroke-width="10" opacity="0.55"/>
  <!-- Paddle head (lime) -->
  <ellipse cx="248" cy="196" rx="116" ry="136" fill="#C6F432"/>
  <!-- Paddle handle -->
  <rect x="224" y="312" width="48" height="118" rx="22" fill="#C6F432"/>
  <!-- blue pickleball dot -->
  <circle cx="328" cy="306" r="27" fill="#2F5BFF"/>
  <!-- owner shield badge -->
  <path d="M372 322 l46 -18 l46 18 v44 q0 34 -46 54 q-46 -20 -46 -54 z" fill="#2F5BFF"/>
  <path d="M418 348 l-14 22 h12 l-8 26 26 -32 h-12 l10 -20 z" fill="#C6F432"/>
</svg>
